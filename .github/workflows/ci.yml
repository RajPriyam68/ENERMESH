name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://enermesh:enermesh@localhost:5432/enermesh?schema=public
  JWT_ACCESS_SECRET: ci-access-secret-change-me-32
  JWT_REFRESH_SECRET: ci-refresh-secret-change-me-32
  WEB_ORIGIN: http://localhost:3000
  CHAIN_ID: "80002"
  CHAIN_NAME: polygon-amoy
  RPC_URL: https://rpc-amoy.polygon.technology

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enermesh
          POSTGRES_PASSWORD: enermesh
          POSTGRES_DB: enermesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enermesh -d enermesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Apply Prisma migrations
        run: npm run db:deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile contracts
        run: npm run contracts:compile
      - name: Test contracts
        run: npm run contracts:test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose file
        run: |
          cp .env.example .env
          docker compose config
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: enermesh-api:ci
          cache-from: type=gha,scope=enermesh-api
          cache-to: type=gha,mode=min,scope=enermesh-api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: enermesh-web:ci
          cache-from: type=gha,scope=enermesh-web
          cache-to: type=gha,mode=min,scope=enermesh-web
